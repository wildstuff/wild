# Generated by `xtask public-sync` from the development repository's root
# Cargo.toml — do not edit here; the next sync overwrites it.
#
# It carries only what the member crates inherit. No Cargo.lock is
# committed: the members are libraries, and `cargo package` resolves
# fresh against crates.io, as a user of the crates does.

[workspace]
members = ["crates/wild-ingest-contract", "crates/wild-kit-producer"]
resolver = "2"

[workspace.dependencies]
hex = "0.4"
schemars = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[workspace.dependencies.rustls]
default-features = false
features = ["ring"]
version = "0.23"

[workspace.dependencies.serde]
features = ["derive"]
version = "1"

[workspace.dependencies.wild-ingest-contract]
path = "crates/wild-ingest-contract"
version = "0.1.1"

[workspace.package]
edition = "2021"
