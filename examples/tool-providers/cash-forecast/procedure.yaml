# ADR-0202 D4 — the model manifest for the `cash_forecast` Procedure.
#
# The audit card. Every number here is measured, not claimed: the tests in
# `src/procedure.rs` re-derive `parameters` and `holdout.score` from the training
# extract this file names, and fail if either drifts. D7.2 asks that an
# auditor be able to re-check a Procedure with a spreadsheet — that is what
# makes this a record rather than a story.
#
# At runtime this rides `forge.meta.json` → `ForgeBuildCompleteEvent` →
# `ComponentTypeYaml.model` (ADR-0202 D10.2). It is kept here beside the
# source because that workspace file is written by the host, never
# committed — this is the authored half a re-forge starts from.
---
slug: cash_forecast
version: v4
method: >-
  Seasonal weekly-bucket model over payment inflows. Each week of the year
  gets one multiplicative factor, fitted as the mean inflow of that bucket
  divided by the overall mean of the training window; the forecast is the
  baseline times the factor of the bucket the target date falls in. Weekly
  buckets are counted from the epoch Monday 2023-01-02. No trend term and
  no outlier handling — the fit is deliberately the simplest thing that
  carries the seasonality, so it stays hand-checkable.
