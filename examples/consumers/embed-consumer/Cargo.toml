# Reference CONSUMER of `wild:ai/embed` — the copy-paste starting point
# for a 3rd-party author who wants text → vector inside a tribe.
#
# Standalone — NOT a member of the host workspace (the wasm32 target
# would otherwise pull host-target deps into the embedded host's build;
# see plugins/workers/ai-worker/Cargo.toml for the full rationale).
# Build it explicitly with `cargo component build --release`.
[workspace]

[package]
name         = "embed-consumer"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.97.0"
license      = "Apache-2.0"
repository   = "https://github.com/wildstuff/the-wild"
description  = "Reference wild:ai/embed consumer — wakes on a NATS subject, embeds the message body, publishes dims + a vector preview (Tier-2 workload component)"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.58.0", features = ["async-spawn"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Wasm components are single-threaded; no tokio.

[package.metadata.component]
package = "wildstuff:embed-consumer"

[package.metadata.component.target]
path  = "wit"
world = "embed-consumer"

# WIT-package deps for the world's imports + exports. Path deps straight
# at the canonical text-WIT under `wit/<pkg>/` (the math-tools / ai-worker
# pattern). The wit-bindgen macro ALSO reads `wit/deps/<name>/` next to
# `wit/world.wit` (checked-in symlinks resolving to the same files), so
# both surfaces have to agree — see ./wit/deps/.
[package.metadata.component.target.dependencies]
"wild:ai"          = { path = "../../../wit/ai/ai.wit" }
"wild:messaging"   = { path = "../../../wit/messaging/messaging.wit" }
"wild:plugin-meta" = { path = "../../../wit/plugin-meta/plugin-meta.wit" }
"wasi:config"      = { path = "../../../wit/external/wasi-config-0.2.0-draft.wasm" }
