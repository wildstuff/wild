# Deterministic teaching adapter for `wild:llm-adapter@0.3.0` — the
# copy-paste starting point for a Tier-2 LLM-adapter component. No
# network, no secrets: the reply is derived from the request, so the
# full contract (buffered chat + both streaming surfaces + the meta
# lifecycle) can be exercised without any upstream provider.
#
# Standalone — explicitly NOT a member of the wild workspace (the
# wasm32-wasip2 target would otherwise pull host-target deps into the
# embedded host's build). Empty `[workspace]` table tells cargo this
# manifest defines its own (single-member) workspace.

[workspace]

[package]
name         = "echo-llm"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.97.0"
license      = "Apache-2.0"
repository   = "https://github.com/wildstuff/the-wild"
description  = "Deterministic echo adapter teaching the wild:llm-adapter@0.3.0 Tier-2 contract — no network, no secrets"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `async-spawn` is required by the `chat-stream-native` export (the
# `async func` + `stream`/`future` types need wit-bindgen 0.58's
# component-model-async runtime).
wit-bindgen = { version = "=0.58.0", features = ["async-spawn"] }

# Wasm components are single-threaded; no tokio.

[package.metadata.component]
package = "wildstuff:echo-llm"

[package.metadata.component.target]
path  = "wit"
world = "echo-llm"

# WIT-package deps for the world's imports + exports. Path deps straight
# at the canonical text-WIT under `wit/<pkg>/`. The wit-bindgen macro
# ALSO reads `wit/deps/<name>/` next to `wit/world.wit` (checked-in
# symlinks resolving to the same files), so both surfaces have to
# agree — see ./wit/deps/.
[package.metadata.component.target.dependencies]
"wild:plugin-meta" = { path = "../../../wit/plugin-meta/plugin-meta.wit" }
"wild:llm-adapter" = { path = "../../../wit/llm-adapter/llm-adapter.wit" }
"wild:secrets"     = { path = "../../../wit/secrets/secrets.wit" }
"wasi:http"        = { path = "../../../wit/external/wasi-http-0.2.0.wasm" }

[profile.release]
opt-level     = "z"
lto           = true
strip         = true
codegen-units = 1
