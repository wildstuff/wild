# `wild tribe apply <bundle-dir>` reads this file. Schema lives in
# `crates/runtime/wild-tribe-ops/src/bundle.rs::BundleManifest`.
#
# The MINIMAL AREA-SIBLING reference tribe (ADR-0194): together with
# `liquidity-management` it forms the two-tribe `finanzen` area — the
# fixture that proves the Elder's area-context grounding ("which tribe
# of the area does the reporting?" is answerable from grounding, not
# from a tribe-by-tribe pull). It advertises ONE capability offer
# (`cash-report`, derived from the spec frontmatter in
# `specs/cash-report.md`) and carries no workers — the smallest tribe
# that still shows up meaningfully in its area's roster.
schema_version: "1"

name: reporting

# ADR-0118 — declared area membership. The deploy seam stamps this
# into the tribe's `meta.yaml::area`; the registry reconciler mirrors
# it into `tribe-registry`, where area siblings discover each other.
area: finanzen

description: >
  Financial reporting tribe of the `finanzen` area: produces the
  recurring cash reports and evaluations over the numbers its sibling
  `liquidity-management` maintains. Deliberately minimal — a
  fork-starter for "what does an area sibling look like?".

# Top-level tribe under the Elder, like its liquidity sibling.
parent_tribe: root

# No workers, no schedule — this fixture exists for its area
# membership + capability offer, not for autonomous work.
workers: []
