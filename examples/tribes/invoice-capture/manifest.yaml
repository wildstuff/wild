# `wild tribe apply <bundle> --as <id>` reads this. Schema:
# `crates/runtime/wild-tribe-ops/src/bundle.rs::BundleManifest`.
#
# ADR-0171 Phase 2.4.5 example: the complete single-document Content Flow —
# an invoice PDF dropped into a folder source is extracted, paused at a
# `does: review, using: confirm` stage for operator confirmation, admitted
# through the governed `ingest-candidates` sink, and announced with a
# `notify-operator` notice. The `extract` stage is dispatched to the built-in
# `extract-worker` every tribe is born with, which reads each PDF with the
# profile's LLM — so this example needs a model configured on the profile.
schema_version: "1"

name: invoice-capture
description: >-
  End-to-end example for the ADR-0171 Content Flow lifecycle:
  capture -> extract -> confirm (operator pause) -> file -> notify.

parent_tribe: root

authoring_method: ddd

external_components:
  - extract-worker

workers: []
