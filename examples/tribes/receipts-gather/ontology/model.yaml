# The constitution of the receipts-gather reference tribe (ADR-0108 DDD
# lane). Deliberately minimal: ONE mirrored aggregate, ONE folder source,
# ONE source process — the smallest model that exercises the ADR-0128
# gather flow (per-file fan-out children converging on a `does: gather`
# step) plus the ADR-0125 `notify-operator` sink. No worker, no LLM.
context: receipts

aggregates:
  # source_mirror: the receipt ledger — ingest-owned, never hand-edited.
  - name: receipt
    display_name: Receipt
    plural: Receipts
    description: >-
      One expense receipt as delivered into the receipts folder — mirrored
      from the CSV drop, never hand-edited.
    title_key: receipt_id
    identity:
      key: [receipt_id]
    mirror:
      - { name: receipt_id, type: text, required: true, description: The receipt's document number }
      - { name: vendor, type: text, description: Who issued the receipt }
      - { name: amount, type: decimal, description: "Gross amount in EUR (a real receipt export carries decimal euros, e.g. 12.50 — not integer cents)" }

sources:
  # A folder feed on the born-with defaults (folder connector + csv adapter).
  # The interval trigger only ARMS the source — the e2e drives each pull
  # deterministically via the `intake_sync` operator verb, so the window is
  # deliberately wide (nothing fires on its own mid-test).
  - slug: receipts-inbound
    name: Belegeingang
    locator: inbox/receipts
    target_type: receipt
    trigger:
      - { kind: interval, seconds: 3600 }
    columns: [receipt_id, vendor, amount]
    # The mapping is DECLARED (not shape-learned): per-file fan-out children
    # run concurrently, and a mapping-less source would race the first-batch
    # shape learning across them.
    mapping:
      - { column: receipt_id, field: receipt_id, ty: text }
      - { column: vendor, field: vendor, ty: text }
      - { column: amount, field: amount, ty: decimal }

processes:
  # The gather flow (ADR-0128): the source process EXTENDS its folder source
  # (same slug — the takeover), so each per-file fan-out child continues from
  # the ingest stage, arrives at the `gather` barrier (the edge below lowers
  # to the explicit `join:gather` form), and the LAST arrival folds the
  # per-file results into ONE item — which sends ONE operator notice for the
  # whole pull instead of one per file.
  - slug: receipts-inbound
    name: Belegeingang gesammelt
    description: >-
      When the receipts folder is pulled, gather the per-file results and
      tell the operator once how the batch went.
    on: { source: receipts-inbound }
    steps:
      - { id: gather, does: gather }   # the identity fold (`collect`)
      - id: announce
        does: notify
        using: notify-operator
        config:
          severity: info
          title: "Receipts folder processed"
          body: "{{ arrived }} of {{ expected }} file(s) processed."
    flow:
      - { from: ingest, to: gather }
      - { from: gather, to: announce }
