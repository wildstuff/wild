<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0b1220" flood-opacity="0.07"/>
    </filter>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0.8 L 7 4 L 0 7.2" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="1096" height="316" rx="20" fill="#ffffff" stroke="#d0d7de"/>

  <!-- you say -->
  <g filter="url(#soft)">
    <rect x="52" y="96" width="304" height="88" rx="18" fill="#eef6ff" stroke="#c9ddf5"/>
  </g>
  <path d="M 96 184 l -10 16 l 24 -16 z" fill="#eef6ff" stroke="#c9ddf5"/>
  <text x="76" y="132" font-size="15" font-weight="600" fill="#1f2328">“Lunch was 200 g</text>
  <text x="76" y="154" font-size="15" font-weight="600" fill="#1f2328">of chicken breast.”</text>
  <text x="76" y="212" font-size="12" fill="#57606a">that's all you type</text>

  <path d="M 366 140 L 424 140" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- the reference card = the receipt -->
  <g filter="url(#soft)">
    <rect x="434" y="84" width="288" height="112" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  </g>
  <g fill="none" stroke="#57606a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 462 110 h 30 v 42 l -5 -5 l -5 5 l -5 -5 l -5 5 l -5 -5 l -5 5 z"/>
  </g>
  <text x="510" y="118" font-size="14.5" font-weight="600" fill="#1f2328">Chicken breast</text>
  <text x="510" y="138" font-size="13" fill="#57606a">165 kcal per 100 g</text>
  <text x="510" y="158" font-size="12" fill="#8c959f">source: USDA food data</text>
  <text x="462" y="182" font-size="12" fill="#007aff">a table you can open — and correct</text>

  <path d="M 732 140 L 790 140" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="761" y="128" text-anchor="middle" font-size="12" fill="#57606a">× 200 g</text>

  <!-- the answer -->
  <g filter="url(#soft)">
    <rect x="800" y="88" width="240" height="104" rx="16" fill="#f2fbf5" stroke="#bfe6cb"/>
  </g>
  <circle cx="840" cy="140" r="16" fill="none" stroke="#34c759" stroke-width="2"/>
  <path d="M 832.5 140.5 l 5.5 5.5 l 10 -11" fill="none" stroke="#34c759" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="872" y="134" font-size="24" font-weight="700" fill="#1f2328">330 kcal</text>
  <text x="872" y="158" font-size="12.5" fill="#57606a">computed — not guessed</text>

  <text x="550" y="266" text-anchor="middle" font-size="13" fill="#8c959f">Every number has a receipt. Fix the table once — every future answer is fixed too.</text>
</svg>
