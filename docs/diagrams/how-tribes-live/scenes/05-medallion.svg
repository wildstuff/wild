<text x="470.0" y="70" text-anchor="middle" font-size="15" fill="#6b7480">raw mirror → canonical entities → exact answers</text><defs><marker id="amed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1f2933"/></marker></defs><rect x="60" y="110" width="240" height="210" rx="16" fill="#efe3d2" stroke="#b08d57" stroke-width="3" /><text x="180" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2933" font-style="">🥉 Bronze</text><text x="180" y="178" text-anchor="middle" font-size="14" font-weight="normal" fill="#555" font-style="">raw mirror</text><rect x="100" y="200" width="160" height="70" rx="10" fill="#ffffff" stroke="#b08d57" stroke-width="2" /><text x="180" y="242" text-anchor="middle" font-size="13" font-weight="normal" fill="#1f2933" font-style="">CSV · PDF · page</text><line x1="304" y1="215" x2="356" y2="215" stroke="#1f2933" stroke-width="3" marker-end="url(#amed)"/><rect x="360" y="110" width="240" height="210" rx="16" fill="#e9ebed" stroke="#9aa4af" stroke-width="3" /><text x="480" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2933" font-style="">🥈 Silver</text><text x="480" y="178" text-anchor="middle" font-size="14" font-weight="normal" fill="#555" font-style="">one row per entity</text><rect x="400" y="200" width="160" height="70" rx="10" fill="#ffffff" stroke="#9aa4af" stroke-width="2" /><text x="480" y="242" text-anchor="middle" font-size="13" font-weight="normal" fill="#1f2933" font-style="">“Müller” = “Mueller”</text><line x1="604" y1="215" x2="656" y2="215" stroke="#1f2933" stroke-width="3" marker-end="url(#amed)"/><rect x="660" y="110" width="240" height="210" rx="16" fill="#f7eecb" stroke="#e0b341" stroke-width="3" /><text x="780" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2933" font-style="">🥇 Gold</text><text x="780" y="178" text-anchor="middle" font-size="14" font-weight="normal" fill="#555" font-style="">exact answers</text><rect x="700" y="200" width="160" height="70" rx="10" fill="#ffffff" stroke="#e0b341" stroke-width="2" /><text x="780" y="242" text-anchor="middle" font-size="13" font-weight="normal" fill="#1f2933" font-style="">price drift +12%</text><path d="M180,330 H780" stroke="#3b3b6d" stroke-width="2" stroke-dasharray="3 6"/><text x="480.0" y="360" text-anchor="middle" font-size="13" font-weight="normal" fill="#3b3b6d" font-style="italic">provenance thread — every answer traces back to its source</text></svg>
