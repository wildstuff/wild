<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',sans-serif">
<rect width="940" height="470" rx="18" fill="#fbfaf7"/>
<text x="470.0" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2933">How a Tribe evolves</text>
<text x="470.0" y="70" text-anchor="middle" font-size="15" fill="#6b7480">forge a tool · earn trust · act — but never on irreversible power</text><rect x="50" y="100" width="360" height="320" rx="14" fill="#fbeede" stroke="#e08a2b" stroke-width="2.5" /><text x="230" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#e08a2b" font-style="">the Forge</text><path d="M130,300 h140 l-18,22 h-104 z" fill="#5b6470"/><rect x="184" y="322" width="32" height="34" fill="#444b54"/><rect x="150" y="356" width="100" height="16" rx="4" fill="#3a4048"/><polygon points="176,300 196,300 186,270" fill="#e08a2b"/><polygon points="190,300 210,300 200,270" fill="#e0b341"/><polygon points="204,300 224,300 214,270" fill="#e08a2b"/><text x="230" y="200" text-anchor="middle" font-size="30" font-weight="normal" fill="#1f2933" font-style="">🔧</text><rect x="255" y="178" width="72" height="30" rx="8" fill="#e7e9f5" stroke="#3b3b6d" stroke-width="2" /><text x="291" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b3b6d" font-style="">Wasm</text><text x="230" y="402" text-anchor="middle" font-size="12" font-weight="normal" fill="#8a5a1f" font-style="italic">writes Rust → builds in a sandbox → signs it</text><rect x="470" y="330" width="150" height="70" rx="12" fill="#eef2f5" stroke="#5b7c99" stroke-width="2.5" /><text x="545" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933" font-style="">asks</text><rect x="620" y="240" width="150" height="160" rx="12" fill="#eef7f1" stroke="#2f9e6b" stroke-width="2.5" /><text x="695" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933" font-style="">earns trust</text><rect x="770" y="150" width="150" height="250" rx="12" fill="#edf7f1" stroke="#2f9e6b" stroke-width="2.5" /><text x="845" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933" font-style="">acts on its own</text><text x="845" y="194" text-anchor="middle" font-size="24" font-weight="normal" fill="#1f2933" font-style="">🔒</text><rect x="770" y="200" width="150" height="40" rx="10" fill="#f3e3e3" stroke="#b35a5a" stroke-width="2.5" /><text x="845" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a" font-style="">irreversible</text><text x="845" y="370" text-anchor="middle" font-size="12" font-weight="normal" fill="#8a3a3a" font-style="italic">always asks</text></svg>
