  <rect x="60" y="78" width="1080" height="14" fill="#fbfcfd"/>
  <line x1="60" y1="92" x2="1140" y2="92" stroke="#e8ebee"/>
  <circle cx="88" cy="70" r="6" fill="#ff5f57"/><circle cx="108" cy="70" r="6" fill="#febc2e"/><circle cx="128" cy="70" r="6" fill="#28c840"/>
  <text x="600" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#57606a">Wild — liquidity · Atlas</text>

