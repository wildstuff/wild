  <text x="84" y="196" font-size="12.5" fill="#57606a">Flows</text>
  <text x="84" y="228" font-size="12.5" fill="#57606a">Inbox</text>
  <text x="84" y="260" font-size="12.5" fill="#57606a">Apps</text>

  <!-- ① ingest strip -->
