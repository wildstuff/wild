  <rect x="848" y="92" width="292" height="456" fill="#fbfcfd"/>
  <line x1="848" y1="92" x2="848" y2="548" stroke="#e8ebee"/>
  <text x="872" y="126" font-size="13.5" font-weight="700" fill="#1f2328">Invoice RE-2026-0032</text>
  <text x="872" y="150" font-size="12" fill="#57606a">7,400.00 € · due Apr 19 · overdue</text>
  <line x1="872" y1="166" x2="1116" y2="166" stroke="#e8ebee"/>
  <text x="872" y="192" font-size="11.5" fill="#8c959f">PROVENANCE</text>
  <text x="872" y="212" font-size="12" fill="#1f2328">mailbox · invoice_2026_0032.pdf</text>
  <text x="872" y="240" font-size="11.5" fill="#8c959f">RELATED</text>
  <text x="872" y="260" font-size="12" fill="#1f2328">Partner BP-004 · Dunning level 1</text>
  <text x="872" y="292" font-size="11.5" fill="#8c959f">ACTIONS</text>
  <g filter="url(#soft)">
    <rect x="872" y="306" width="244" height="38" rx="19" fill="#eef6ff" stroke="#c9ddf5"/>
    <rect x="872" y="354" width="244" height="38" rx="19" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="872" y="402" width="244" height="38" rx="19" fill="#fff9f2" stroke="#ffd9a8"/>
  </g>
