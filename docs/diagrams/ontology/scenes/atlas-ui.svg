  <text x="994" y="378" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Escalate reminder…</text>
  <text x="994" y="426" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c25e00">Write off… 🔒</text>
  <circle cx="1116" cy="466" r="13" fill="none" stroke="#007aff" stroke-width="2"/>
  <text x="1116" y="471" text-anchor="middle" font-size="12" font-weight="700" fill="#007aff">3</text>
  <text x="872" y="471" font-size="11.5" fill="#57606a">effects — locks ask you first</text>

  <!-- legend -->
  <text x="600" y="586" text-anchor="middle" font-size="12.5" fill="#57606a"><tspan font-weight="700" fill="#007aff">1</tspan> Ingest — sources feeding records · <tspan font-weight="700" fill="#007aff">2</tspan> Entities &amp; relations — the graph · <tspan font-weight="700" fill="#007aff">3</tspan> Effects — gated actions · <tspan font-weight="700" fill="#007aff">4</tspan> Workers — who acted, on the record</text>
  <text x="600" y="614" text-anchor="middle" font-size="11.5" font-style="italic" fill="#8c959f">Illustration of the dashboard's Atlas view — composition and labels match the product; pixels are drawn, not screenshotted.</text>
</svg>
