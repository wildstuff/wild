    <rect x="470" y="300" width="150" height="46" rx="10" fill="#ffffff" stroke="#c9ddf5"/>
    <rect x="300" y="330" width="150" height="46" rx="10" fill="#ffffff" stroke="#c9ddf5"/>
  </g>
  <line x1="502" y1="219" x2="590" y2="202" stroke="#b6c8dd" stroke-width="1.6"/>
  <line x1="440" y1="242" x2="522" y2="300" stroke="#b6c8dd" stroke-width="1.6"/>
  <line x1="420" y1="330" x2="440" y2="242" stroke="#b6c8dd" stroke-width="1.6"/>
  <text x="427" y="215" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Invoice</text>
  <text x="427" y="232" text-anchor="middle" font-size="10.5" fill="#57606a">RE-2026-0032 · overdue</text>
  <text x="665" y="195" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Partner</text>
  <text x="665" y="212" text-anchor="middle" font-size="10.5" fill="#57606a">BP-004 · debtor</text>
  <text x="545" y="319" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Dunning</text>
  <text x="545" y="336" text-anchor="middle" font-size="10.5" fill="#57606a">level 1 · sent</text>
  <text x="375" y="349" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Bank movement</text>
  <text x="375" y="366" text-anchor="middle" font-size="10.5" fill="#57606a">+15,000 € · Apr 2</text>
  <circle cx="320" cy="440" r="13" fill="none" stroke="#007aff" stroke-width="2"/>
  <text x="320" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#007aff">2</text>
  <text x="344" y="445" font-size="11.5" fill="#57606a">the entity graph — click any node</text>

  <!-- ④ worker activity -->
  <rect x="264" y="486" width="560" height="40" rx="10" fill="#fbfdff" stroke="#c9ddf5"/>
  <g fill="none" stroke="#34c759" stroke-width="1.6">
    <circle cx="290" cy="506" r="9" fill="#f2fbf5"/>
  </g>
  <text x="308" y="511" font-size="12.5" fill="#1f2328">receivables-chaser <tspan fill="#57606a">— raised the level-1 dunning · 07:14 · on the record</tspan></text>
  <circle cx="796" cy="506" r="13" fill="none" stroke="#007aff" stroke-width="2"/>
  <text x="796" y="511" text-anchor="middle" font-size="12" font-weight="700" fill="#007aff">4</text>

