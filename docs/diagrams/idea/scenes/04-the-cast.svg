<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',sans-serif">
  <rect width="1000" height="600" rx="18" fill="#fbfaf7"/>
  <text x="500" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#1f2933">The cast</text>
  <text x="500" y="72" text-anchor="middle" font-size="15" fill="#6b7480">six nouns carry the whole model — everything else is detail</text>

  <!-- ===== Elder ===== -->
  <rect x="30" y="100" width="300" height="212" rx="14" fill="#ffffff" stroke="#d8d3c8" stroke-width="2"/>
  <g fill="none" stroke="#3b3b6d" stroke-width="2.5" stroke-linecap="round">
    <path d="M74,196 v-38 a26,26 0 0 1 52,0 v38"/>
    <line x1="64" y1="196" x2="136" y2="196"/>
    <line x1="100" y1="158" x2="100" y2="196"/>
  </g>
  <circle cx="100" cy="142" r="7" fill="#e0b341" stroke="#3b3b6d" stroke-width="2"/>
  <text x="164" y="146" font-size="17" font-weight="bold" fill="#1f2933">Elder</text>
  <rect x="164" y="158" width="130" height="22" rx="11" fill="#f1eef7" stroke="#3b3b6d" stroke-width="1.4"/>
  <text x="229" y="173" text-anchor="middle" font-size="10.5" fill="#3b3b6d">one per install</text>
  <text x="164" y="204" font-size="12" fill="#6b7480">The gatekeeper. Onboards</text>
  <text x="164" y="222" font-size="12" fill="#6b7480">new Tribes, routes you</text>
  <text x="164" y="240" font-size="12" fill="#6b7480">between them, operates</text>
  <text x="164" y="258" font-size="12" fill="#6b7480">them on your behalf.</text>
  <text x="60" y="288" font-size="11.5" font-style="italic" fill="#3b3b6d">you talk to Elder — never to the machinery</text>

  <!-- ===== Atlas ===== -->
  <rect x="350" y="100" width="300" height="212" rx="14" fill="#ffffff" stroke="#d8d3c8" stroke-width="2"/>
  <g stroke="#2f9e6b" stroke-width="2">
    <line x1="396" y1="152" x2="428" y2="176"/>
    <line x1="428" y1="176" x2="400" y2="196"/>
    <line x1="396" y1="152" x2="400" y2="196"/>
  </g>
  <g fill="#bfe6d2" stroke="#2f9e6b" stroke-width="2">
    <circle cx="396" cy="152" r="10"/>
    <circle cx="428" cy="176" r="10"/>
    <circle cx="400" cy="196" r="10"/>
  </g>
  <line x1="368" y1="216" x2="444" y2="216" stroke="#b08d57" stroke-width="3"/>
  <text x="484" y="146" font-size="17" font-weight="bold" fill="#1f2933">Atlas</text>
  <rect x="484" y="158" width="130" height="22" rx="11" fill="#edf7f1" stroke="#2f9e6b" stroke-width="1.4"/>
  <text x="549" y="173" text-anchor="middle" font-size="10.5" fill="#3f6b55">one per Tribe</text>
  <text x="484" y="204" font-size="12" fill="#6b7480">The ground everything</text>
  <text x="484" y="222" font-size="12" fill="#6b7480">stands on: your things,</text>
  <text x="484" y="240" font-size="12" fill="#6b7480">their relations, each fact</text>
  <text x="484" y="258" font-size="12" fill="#6b7480">with its origin.</text>
  <text x="380" y="288" font-size="11.5" font-style="italic" fill="#3f6b55">throw away every prompt — this survives</text>

  <!-- ===== Chief ===== -->
  <rect x="670" y="100" width="300" height="212" rx="14" fill="#ffffff" stroke="#d8d3c8" stroke-width="2"/>
  <circle cx="740" cy="176" r="34" fill="none" stroke="#5b7c99" stroke-width="2.5" stroke-dasharray="4 6"/>
  <path d="M740,142 a34,34 0 0 1 30,18" fill="none" stroke="#5b7c99" stroke-width="3" stroke-linecap="round"/>
  <path d="M766,152 l8,10 l-13,3 z" fill="#5b7c99"/>
  <path d="M728,166 h24 v20 h-24 z" fill="#eef2f5" stroke="#5b7c99" stroke-width="2"/>
  <path d="M728,166 l6,-12 l6,8 l6,-8 l6,12 z" fill="#e0b341" stroke="#5b7c99" stroke-width="2" stroke-linejoin="round"/>
  <text x="804" y="146" font-size="17" font-weight="bold" fill="#1f2933">Chief</text>
  <rect x="804" y="158" width="130" height="22" rx="11" fill="#eef2f5" stroke="#5b7c99" stroke-width="1.4"/>
  <text x="869" y="173" text-anchor="middle" font-size="10.5" fill="#5b7c99">one per Tribe</text>
  <text x="804" y="204" font-size="12" fill="#6b7480">Reads the Tribe's charter,</text>
  <text x="804" y="222" font-size="12" fill="#6b7480">runs the cycles, decides</text>
  <text x="804" y="240" font-size="12" fill="#6b7480">what happens next and</text>
  <text x="804" y="258" font-size="12" fill="#6b7480">who does it.</text>
  <text x="700" y="288" font-size="11.5" font-style="italic" fill="#5b7c99">keeps working between your messages</text>

  <!-- ===== Worker ===== -->
  <rect x="30" y="330" width="300" height="212" rx="14" fill="#ffffff" stroke="#d8d3c8" stroke-width="2"/>
  <g fill="#bfe6d2" stroke="#2f9e6b" stroke-width="2">
    <circle cx="78" cy="392" r="12"/>
    <circle cx="110" cy="386" r="12"/>
    <circle cx="142" cy="392" r="12"/>
  </g>
  <g fill="#bfe6d2" stroke="#2f9e6b" stroke-width="2">
    <path d="M62,428 a16,16 0 0 1 32,0 z"/>
    <path d="M94,422 a16,16 0 0 1 32,0 z"/>
    <path d="M126,428 a16,16 0 0 1 32,0 z"/>
  </g>
  <text x="164" y="376" font-size="17" font-weight="bold" fill="#1f2933">Worker</text>
  <rect x="164" y="388" width="130" height="22" rx="11" fill="#edf7f1" stroke="#2f9e6b" stroke-width="1.4"/>
  <text x="229" y="403" text-anchor="middle" font-size="10.5" fill="#3f6b55">many per Tribe</text>
  <text x="164" y="434" font-size="12" fill="#6b7480">The specialists doing the</text>
  <text x="164" y="452" font-size="12" fill="#6b7480">actual work — reading</text>
  <text x="164" y="470" font-size="12" fill="#6b7480">PDFs, chasing invoices,</text>
  <text x="164" y="488" font-size="12" fill="#6b7480">drafting, scoring.</text>
  <text x="60" y="518" font-size="11.5" font-style="italic" fill="#3f6b55">AI-, rule-, shell-, api- or human-backed</text>

  <!-- ===== Forge ===== -->
  <rect x="350" y="330" width="300" height="212" rx="14" fill="#ffffff" stroke="#d8d3c8" stroke-width="2"/>
  <path d="M382,410 h74 l-10,16 h-54 z" fill="#9aa4af" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400,426 h38 v12 l12,20 h-62 l12,-20 z" fill="#9aa4af" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
  <path d="M456,410 h22 l-8,8 h-14 z" fill="#9aa4af" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#e08a2b" stroke-width="2.5" stroke-linecap="round">
    <line x1="418" y1="390" x2="418" y2="378"/>
    <line x1="396" y1="396" x2="388" y2="386"/>
    <line x1="442" y1="396" x2="450" y2="386"/>
  </g>
  <circle cx="418" cy="400" r="5" fill="#e0b341"/>
  <text x="484" y="376" font-size="17" font-weight="bold" fill="#1f2933">Forge</text>
  <rect x="484" y="388" width="130" height="22" rx="11" fill="#fdf3e7" stroke="#e08a2b" stroke-width="1.4"/>
  <text x="549" y="403" text-anchor="middle" font-size="10.5" fill="#a86518">one per Tribe</text>
  <text x="484" y="434" font-size="12" fill="#6b7480">The smithy. When a tool</text>
  <text x="484" y="452" font-size="12" fill="#6b7480">is missing, the Tribe</text>
  <text x="484" y="470" font-size="12" fill="#6b7480">builds it — sandboxed,</text>
  <text x="484" y="488" font-size="12" fill="#6b7480">pinned, approval-gated.</text>
  <text x="380" y="518" font-size="11.5" font-style="italic" fill="#a86518">this is what makes a Tribe generative</text>

  <!-- ===== App ===== -->
  <rect x="670" y="330" width="300" height="212" rx="14" fill="#ffffff" stroke="#d8d3c8" stroke-width="2"/>
  <rect x="708" y="368" width="72" height="102" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="2.5"/>
  <rect x="716" y="382" width="56" height="74" rx="5" fill="#edf7f1" stroke="#2f9e6b" stroke-width="1.6"/>
  <g fill="#bfe6d2">
    <rect x="723" y="392" width="42" height="6" rx="3"/>
    <rect x="723" y="406" width="42" height="6" rx="3"/>
    <rect x="723" y="420" width="42" height="6" rx="3"/>
  </g>
  <circle cx="744" cy="442" r="9" fill="#2f9e6b"/>
  <path d="M740,442 l3,4 l6,-8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="804" y="376" font-size="17" font-weight="bold" fill="#1f2933">App</text>
  <rect x="804" y="388" width="130" height="22" rx="11" fill="#edf7f1" stroke="#2f9e6b" stroke-width="1.4"/>
  <text x="869" y="403" text-anchor="middle" font-size="10.5" fill="#3f6b55">many per Tribe</text>
  <text x="804" y="434" font-size="12" fill="#6b7480">What a Tribe hands the</text>
  <text x="804" y="452" font-size="12" fill="#6b7480">people around you — a</text>
  <text x="804" y="470" font-size="12" fill="#6b7480">table, a card, a button,</text>
  <text x="804" y="488" font-size="12" fill="#6b7480">governed per person.</text>
  <text x="700" y="518" font-size="11.5" font-style="italic" fill="#3f6b55">derived from the ontology, not developed</text>

  <text x="500" y="572" text-anchor="middle" font-size="13" fill="#1f2933">One install: one <tspan font-weight="bold">Elder</tspan>, many <tspan font-weight="bold">Tribes</tspan>.  One Tribe: one <tspan font-weight="bold">Chief</tspan>, one <tspan font-weight="bold">Atlas</tspan>, one <tspan font-weight="bold">Forge</tspan> — and as many <tspan font-weight="bold">Workers</tspan> and <tspan font-weight="bold">Apps</tspan> as it needs.</text>
</svg>
