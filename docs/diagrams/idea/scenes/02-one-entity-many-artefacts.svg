  <path d="M94,228 v12 h12" fill="none" stroke="#5b7c99" stroke-width="1.8"/>
  <text x="124" y="242" font-size="12.5" font-weight="bold" fill="#1f2933">invoice-RE-0032.pdf</text>
  <text x="124" y="262" font-size="11" fill="#6b7480">invoice</text>
  <text x="124" y="278" font-size="11" fill="#6b7480">arrived Apr 2</text>

  <rect x="40" y="302" width="250" height="84" rx="12" fill="#ffffff" stroke="#5b7c99" stroke-width="2"/>
  <rect x="62" y="330" width="48" height="34" rx="5" fill="#eef2f5" stroke="#5b7c99" stroke-width="1.8"/>
  <path d="M62,334 L86,352 L110,334" fill="none" stroke="#5b7c99" stroke-width="1.8"/>
  <text x="124" y="338" font-size="12.5" font-weight="bold" fill="#1f2933">bill-04.eml</text>
  <text x="124" y="358" font-size="11" fill="#6b7480">e-mail from the provider</text>
  <text x="124" y="374" font-size="11" fill="#6b7480">arrived Apr 12</text>

  <rect x="40" y="398" width="250" height="84" rx="12" fill="#ffffff" stroke="#5b7c99" stroke-width="2"/>
  <g fill="#eef2f5" stroke="#5b7c99" stroke-width="1.8">
    <rect x="62" y="424" width="48" height="36" rx="4"/>
  </g>
  <g stroke="#5b7c99" stroke-width="1.4">
    <line x1="62" y1="436" x2="110" y2="436"/>
    <line x1="62" y1="448" x2="110" y2="448"/>
    <line x1="86" y1="424" x2="86" y2="460"/>
