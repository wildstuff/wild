  <rect width="1000" height="560" rx="18" fill="#fbfaf7"/>
  <text x="500" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#1f2933">One entity, many artefacts</text>
  <text x="500" y="72" text-anchor="middle" font-size="15" fill="#6b7480">the artefacts stay — the entity is what they add up to</text>

