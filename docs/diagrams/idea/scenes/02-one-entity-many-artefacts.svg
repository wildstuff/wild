    <path d="M294,152 C322,152 326,236 350,244"/>
    <path d="M294,248 C322,248 328,272 350,278"/>
    <path d="M294,344 C322,344 328,320 350,312"/>
    <path d="M294,440 C322,440 326,356 350,348"/>
