  <!-- ============ the entity ============ -->
  <rect x="360" y="110" width="600" height="374" rx="16" fill="#edf7f1" stroke="#2f9e6b" stroke-width="2.5"/>
  <text x="390" y="140" font-size="12" font-weight="bold" fill="#2f9e6b">ONE ENTITY</text>
  <rect x="390" y="152" width="540" height="42" rx="12" fill="#ffffff" stroke="#2f9e6b" stroke-width="2"/>
  <text x="660" y="180" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">Partner · Stadtwerke Nord</text>

  <g font-size="11" font-weight="bold" fill="#3f6b55">
    <text x="392" y="226">field</text>
    <text x="566" y="226">value</text>
    <text x="734" y="226">came from</text>
  </g>
  <line x1="390" y1="234" x2="930" y2="234" stroke="#bfe6d2" stroke-width="1.6"/>

  <g font-size="12.5" fill="#1f2933">
