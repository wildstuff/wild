    <text x="392" y="334">notice period</text>
    <text x="392" y="370">billing address</text>
    <text x="392" y="406">IBAN</text>
  </g>
  <g font-size="12.5" fill="#1f2933">
    <text x="566" y="262">Stadtwerke Nord</text>
    <text x="566" y="298">4471-B</text>
    <text x="566" y="334">3 months</text>
    <text x="566" y="370">Ringstr. 8</text>
    <text x="566" y="406">DE44 … 0231</text>
  </g>
  <g fill="#ffffff" stroke="#2f9e6b" stroke-width="1.4">
    <rect x="730" y="246" width="200" height="22" rx="11"/>
    <rect x="730" y="282" width="200" height="22" rx="11"/>
    <rect x="730" y="318" width="200" height="22" rx="11"/>
    <rect x="730" y="354" width="200" height="22" rx="11"/>
    <rect x="730" y="390" width="200" height="22" rx="11"/>
  </g>
  <g font-size="10.5" fill="#3f6b55" text-anchor="middle">
    <text x="830" y="261">contract-2019.pdf · p.1</text>
    <text x="830" y="297">invoice-RE-0032.pdf</text>
    <text x="830" y="333">contract-2019.pdf · p.4</text>
    <text x="830" y="369">bill-04.eml</text>
    <text x="830" y="405">bank-2026-04.csv</text>
  </g>
  <text x="390" y="450" font-size="12" font-style="italic" fill="#3f6b55">no artefact was consumed — each field still points at the page it came from</text>

  <text x="500" y="524" text-anchor="middle" font-size="13" font-style="italic" fill="#1f2933">The entity is not a copy of one document. It is what all of them, together, say about one thing.</text>
</svg>
