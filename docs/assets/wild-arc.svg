<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0b1220" flood-opacity="0.07"/>
    </filter>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0.8 L 7 4 L 0 7.2" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="2" y="2" width="1196" height="596" rx="20" fill="#ffffff" stroke="#d0d7de"/>

  <!-- ── you say it ─────────────────────────────────────────── -->
  <g filter="url(#soft)">
    <rect x="330" y="40" width="540" height="64" rx="32" fill="#ffffff" stroke="#d0d7de"/>
  </g>
  <circle cx="374" cy="72" r="17" fill="#eef4ff"/>
  <path d="M 366 72 a 8 8 0 1 1 8 8 l -8 0 z" fill="#007aff"/>
  <text x="404" y="66" font-size="15.5" font-weight="600" fill="#1f2328">“Watch our contracts — and give Anna an app.”</text>
  <text x="404" y="87" font-size="12.5" fill="#57606a">You say it, in your language. Elder takes it from there.</text>
  <path d="M 600 104 L 600 158" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#a)"/>

  <!-- ── left: your world ───────────────────────────────────── -->
  <text x="90" y="205" font-size="12" font-weight="700" fill="#8c959f" letter-spacing="1.6">YOUR WORLD</text>
  <g stroke="#57606a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- folder -->
    <path d="M 92 246 h 14 l 5 6 h 21 a 4 4 0 0 1 4 4 v 22 a 4 4 0 0 1 -4 4 h -40 a 4 4 0 0 1 -4 -4 v -28 a 4 4 0 0 1 4 -4 z"/>
    <!-- envelope -->
    <rect x="88" y="316" width="44" height="32" rx="4"/>
    <path d="M 90 320 L 110 336 L 130 320"/>
    <!-- globe -->
    <circle cx="110" cy="416" r="20"/>
    <ellipse cx="110" cy="416" rx="9" ry="20"/>
    <line x1="91" y1="416" x2="129" y2="416"/>
  </g>
  <text x="150" y="262" font-size="14.5" font-weight="600" fill="#1f2328">Folders</text>
  <text x="150" y="281" font-size="12" fill="#57606a">invoices · contracts · scans</text>
  <text x="150" y="332" font-size="14.5" font-weight="600" fill="#1f2328">Mail</text>
  <text x="150" y="351" font-size="12" fill="#57606a">what arrives by itself</text>
  <text x="150" y="412" font-size="14.5" font-weight="600" fill="#1f2328">Web &amp; drives</text>
  <text x="150" y="431" font-size="12" fill="#57606a">portals · SharePoint</text>

  <!-- converge -->
  <g stroke="#8c959f" stroke-width="1.4" fill="none">
    <path d="M 268 260 C 316 268, 330 320, 356 348" marker-end="url(#a)"/>
    <path d="M 268 332 C 308 340, 322 348, 354 356" marker-end="url(#a)"/>
    <path d="M 268 416 C 310 412, 326 384, 354 366" marker-end="url(#a)"/>
  </g>

  <!-- ── center: atlas ──────────────────────────────────────── -->
  <g filter="url(#soft)">
    <rect x="368" y="252" width="464" height="272" rx="16" fill="#fbfdff" stroke="#c9ddf5"/>
  </g>

  <!-- tribe standing on the card -->
  <g fill="none" stroke="#34c759" stroke-width="1.8">
    <circle cx="600" cy="204" r="26" fill="#f2fbf5"/>
    <circle cx="536" cy="222" r="17" fill="#f2fbf5"/>
    <circle cx="664" cy="222" r="17" fill="#f2fbf5"/>
    <line x1="536" y1="239" x2="536" y2="252"/>
    <line x1="600" y1="230" x2="600" y2="252"/>
    <line x1="664" y1="239" x2="664" y2="252"/>
  </g>
  <text x="716" y="196" font-size="12" fill="#57606a">your Tribe — it works the topic</text>
  <text x="716" y="213" font-size="12" fill="#57606a">and builds the tools it's missing</text>
  <path d="M 712 206 C 700 210, 692 214, 685 218" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- entity chips -->
  <g filter="url(#soft)">
    <rect x="398" y="286" width="118" height="40" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="542" y="286" width="118" height="40" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="686" y="286" width="118" height="40" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  </g>
  <line x1="516" y1="306" x2="542" y2="306" stroke="#b6c8dd" stroke-width="1.6"/>
  <line x1="660" y1="306" x2="686" y2="306" stroke="#b6c8dd" stroke-width="1.6"/>
  <text x="457" y="311" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Supplier</text>
  <text x="601" y="311" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Invoice</text>
  <text x="745" y="311" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Contract</text>
  <text x="457" y="345" text-anchor="middle" font-size="11" fill="#007aff">one entity — fed by folder &amp; mail</text>

  <text x="600" y="394" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">The model of your world</text>
  <text x="600" y="415" text-anchor="middle" font-size="12.5" fill="#57606a">built once — connected, searchable, every fact with its origin</text>

  <!-- timeline -->
  <line x1="404" y1="466" x2="796" y2="466" stroke="#c9ddf5" stroke-width="1.6"/>
  <g fill="#7fb2e8">
    <circle cx="428" cy="466" r="3.5"/><circle cx="490" cy="466" r="3.5"/><circle cx="552" cy="466" r="3.5"/>
    <circle cx="614" cy="466" r="3.5"/><circle cx="676" cy="466" r="3.5"/><circle cx="738" cy="466" r="3.5"/>
  </g>
  <circle cx="552" cy="466" r="7" fill="none" stroke="#007aff" stroke-width="1.6"/>
  <g filter="url(#soft)">
    <rect x="500" y="478" width="104" height="24" rx="12" fill="#ffffff" stroke="#c9ddf5"/>
  </g>
  <text x="552" y="494" text-anchor="middle" font-size="11.5" font-weight="600" fill="#007aff">as of March 31</text>
  <text x="676" y="493" font-size="11.5" fill="#57606a">any day, replayable</text>

  <!-- ── right: your people ─────────────────────────────────── -->
  <text x="912" y="205" font-size="12" font-weight="700" fill="#8c959f" letter-spacing="1.6">YOUR PEOPLE</text>
  <!-- phone -->
  <g fill="none" stroke="#57606a" stroke-width="1.8" stroke-linecap="round">
    <rect x="912" y="240" width="34" height="60" rx="7"/>
    <line x1="924" y1="292" x2="934" y2="292"/>
  </g>
  <rect x="918" y="250" width="22" height="14" rx="3" fill="#eef4ff"/>
  <rect x="918" y="268" width="22" height="4" rx="2" fill="#e3e9f0"/>
  <rect x="918" y="276" width="15" height="4" rx="2" fill="#e3e9f0"/>
  <text x="966" y="262" font-size="14.5" font-weight="600" fill="#1f2328">Apps for your family</text>
  <text x="966" y="280" font-size="14.5" font-weight="600" fill="#1f2328">or your team</text>
  <text x="966" y="299" font-size="12" fill="#57606a">nobody wrote them</text>
  <!-- chat answer -->
  <g fill="none" stroke="#57606a" stroke-width="1.8" stroke-linejoin="round">
    <path d="M 912 372 h 40 a 6 6 0 0 1 6 6 v 22 a 6 6 0 0 1 -6 6 h -26 l -10 9 v -9 h -4 a 6 6 0 0 1 -6 -6 v -22 a 6 6 0 0 1 6 -6 z"/>
  </g>
  <line x1="920" y1="386" x2="948" y2="386" stroke="#e3e9f0" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="920" y1="395" x2="940" y2="395" stroke="#e3e9f0" stroke-width="3.5" stroke-linecap="round"/>
  <text x="966" y="388" font-size="14.5" font-weight="600" fill="#1f2328">Answers for you</text>
  <text x="966" y="407" font-size="12" fill="#57606a">with the source attached</text>

  <g stroke="#8c959f" stroke-width="1.4" fill="none">
    <path d="M 832 320 C 866 308, 878 290, 904 274" marker-end="url(#a)"/>
    <path d="M 832 420 C 862 414, 874 402, 902 392" marker-end="url(#a)"/>
  </g>

  <!-- footer -->
  <text x="600" y="566" text-anchor="middle" font-size="13" fill="#8c959f">Built, not billed — everything it grows is yours, on your machine.</text>
</svg>
