<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0b1220" flood-opacity="0.07"/>
    </filter>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0.8 L 7 4 L 0 7.2" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="1196" height="556" rx="20" fill="#ffffff" stroke="#d0d7de"/>

  <text x="60" y="60" font-size="12" font-weight="700" fill="#8c959f" letter-spacing="1.6">INSIDE ONE TRIBE</text>

  <!-- actors row -->
  <g fill="none" stroke="#34c759" stroke-width="1.8">
    <circle cx="330" cy="140" r="30" fill="#f2fbf5"/>
    <circle cx="240" cy="158" r="19" fill="#f2fbf5"/>
    <circle cx="420" cy="158" r="19" fill="#f2fbf5"/>
  </g>
  <text x="330" y="145" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f7a3a">Chief</text>
  <text x="240" y="199" text-anchor="middle" font-size="11.5" fill="#57606a">worker</text>
  <text x="420" y="199" text-anchor="middle" font-size="11.5" fill="#57606a">worker</text>
  <text x="196" y="106" font-size="12" fill="#57606a">reads the Blueprint · runs cycles · dispatches</text>

  <!-- forge -->
  <g filter="url(#soft)">
    <rect x="530" y="112" width="220" height="76" rx="14" fill="#fff9f2" stroke="#ffd9a8"/>
  </g>
  <text x="554" y="142" font-size="14" font-weight="700" fill="#c25e00">Forge</text>
  <text x="554" y="163" font-size="11.5" fill="#57606a">LLM → Rust → sandboxed build</text>
  <text x="554" y="180" font-size="11.5" fill="#57606a">→ Wasm component, content-pinned</text>
  <path d="M 528 160 C 496 166, 476 162, 452 158" stroke="#c25e00" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="470" y="146" font-size="10.5" fill="#c25e00">new tool</text>

  <!-- effect gate chip -->
  <g filter="url(#soft)">
    <rect x="820" y="112" width="320" height="76" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  </g>
  <text x="844" y="140" font-size="13" font-weight="600" fill="#1f2328">Effect surface — every mutation, one door</text>
  <text x="844" y="160" font-size="11.5" fill="#57606a">verbs with risk tiers · trust gates · audit trail</text>
  <text x="844" y="177" font-size="11.5" fill="#57606a">high-risk = operator-confirmed, always</text>

  <!-- legs onto atlas -->
  <g stroke="#34c759" stroke-width="1.8">
    <line x1="240" y1="177" x2="240" y2="238"/>
    <line x1="330" y1="170" x2="330" y2="238"/>
    <line x1="420" y1="177" x2="420" y2="238"/>
  </g>

  <!-- atlas slab -->
  <g filter="url(#soft)">
    <rect x="60" y="238" width="1080" height="200" rx="16" fill="#fbfdff" stroke="#c9ddf5"/>
  </g>
  <text x="92" y="274" font-size="15" font-weight="700" fill="#1f2328">Atlas — the tribe's data ground</text>
  <text x="92" y="296" font-size="12.5" fill="#57606a">ontology (types · fields · relations · functions · verbs) over an event-sourced object graph</text>

  <!-- event log -> projection -->
  <g filter="url(#soft)">
    <rect x="92" y="322" width="330" height="84" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="520" y="322" width="620" height="84" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  </g>
  <text x="116" y="352" font-size="13" font-weight="600" fill="#1f2328">events.jsonl</text>
  <text x="116" y="372" font-size="11.5" fill="#57606a">append-only truth · every fact with provenance</text>
  <text x="116" y="390" font-size="11.5" fill="#007aff">replayable to any position (as-of)</text>
  <path d="M 424 364 L 512 364" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="468" y="352" text-anchor="middle" font-size="10.5" fill="#57606a">fold</text>
  <text x="544" y="352" font-size="13" font-weight="600" fill="#1f2328">projection.sqlite — disposable index</text>
  <text x="544" y="372" font-size="11.5" fill="#57606a">records · relation edges · full-text (fts5) · vectors (vec0)</text>
  <text x="544" y="390" font-size="11.5" fill="#57606a">derived fields · read-model projections · per-type read tools</text>

  <!-- substrate -->
  <rect x="60" y="470" width="1080" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="600" y="492" text-anchor="middle" font-size="12" fill="#57606a">substrate: NATS subjects wild.{tribe}.… · JetStream durable streams · every plugin a sandboxed Wasm component with declared capabilities</text>

  <text x="600" y="534" text-anchor="middle" font-size="12" fill="#8c959f">Chief, workers, and Forge all read and write through Atlas — the ground is the contract.</text>
</svg>
