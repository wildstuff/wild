<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0b1220" flood-opacity="0.07"/>
    </filter>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0.8 L 7 4 L 0 7.2" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="1196" height="516" rx="20" fill="#ffffff" stroke="#d0d7de"/>

  <text x="60" y="66" font-size="12" font-weight="700" fill="#8c959f" letter-spacing="1.6">FOUR DOORS</text>

  <!-- doors -->
  <g filter="url(#soft)">
    <rect x="60" y="92" width="264" height="72" rx="14" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="60" y="184" width="264" height="72" rx="14" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="60" y="276" width="264" height="72" rx="14" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="60" y="368" width="264" height="72" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  </g>
  <text x="84" y="122" font-size="14" font-weight="600" fill="#1f2328">Your Desktop AI</text>
  <text x="84" y="143" font-size="12" fill="#57606a">Claude, Gemini, … — over MCP</text>
  <text x="84" y="214" font-size="14" font-weight="600" fill="#1f2328">Wild.app dashboard</text>
  <text x="84" y="235" font-size="12" fill="#57606a">native desktop · Unix socket</text>
  <text x="84" y="306" font-size="14" font-weight="600" fill="#1f2328">`wild` CLI</text>
  <text x="84" y="327" font-size="12" fill="#57606a">chat REPL · watch console · verbs</text>
  <text x="84" y="398" font-size="14" font-weight="600" fill="#1f2328">Colleagues' browsers</text>
  <text x="84" y="419" font-size="12" fill="#57606a">published apps · via `wild-appd`</text>

  <g stroke="#8c959f" stroke-width="1.4" fill="none">
    <path d="M 324 128 C 396 140, 420 190, 452 218" marker-end="url(#a)"/>
    <path d="M 324 220 C 380 226, 408 234, 450 240" marker-end="url(#a)"/>
    <path d="M 324 312 C 384 306, 410 280, 450 260" marker-end="url(#a)"/>
    <path d="M 324 404 C 396 396, 420 320, 451 276" marker-end="url(#a)"/>
  </g>

  <!-- hostd -->
  <g filter="url(#soft)">
    <rect x="462" y="92" width="678" height="356" rx="16" fill="#fbfdff" stroke="#c9ddf5"/>
  </g>
  <text x="494" y="128" font-size="15" font-weight="700" fill="#1f2328">wild-hostd</text>
  <text x="592" y="128" font-size="12.5" fill="#57606a">one long-running process — embedded Wasm host, no provider sub-processes</text>

  <!-- elder pill -->
  <g filter="url(#soft)">
    <rect x="494" y="152" width="200" height="52" rx="26" fill="#ffffff" stroke="#d0d7de"/>
  </g>
  <circle cx="524" cy="178" r="12" fill="#eef4ff"/>
  <path d="M 518 178 a 6 6 0 1 1 6 6 l -6 0 z" fill="#007aff"/>
  <text x="546" y="174" font-size="14" font-weight="600" fill="#1f2328">Elder</text>
  <text x="546" y="192" font-size="11.5" fill="#57606a">onboards · routes · operates</text>

  <path d="M 594 204 L 594 236" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round" marker-end="url(#a)"/>

  <!-- tribes -->
  <g filter="url(#soft)">
    <rect x="494" y="244" width="298" height="128" rx="14" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="816" y="244" width="298" height="128" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  </g>
  <text x="518" y="274" font-size="13.5" font-weight="700" fill="#1f2328">tribe: liquidity</text>
  <text x="518" y="294" font-size="11.5" fill="#57606a">wild.liquidity.… · own storage · secrets · forge</text>
  <text x="840" y="274" font-size="13.5" font-weight="700" fill="#1f2328">tribe: fitness</text>
  <text x="840" y="294" font-size="11.5" fill="#57606a">wild.fitness.… · own storage · secrets · forge</text>
  <g fill="none" stroke="#34c759" stroke-width="1.6">
    <circle cx="540" cy="332" r="14" fill="#f2fbf5"/><circle cx="576" cy="336" r="10" fill="#f2fbf5"/><circle cx="604" cy="336" r="10" fill="#f2fbf5"/>
    <circle cx="862" cy="332" r="14" fill="#f2fbf5"/><circle cx="898" cy="336" r="10" fill="#f2fbf5"/><circle cx="926" cy="336" r="10" fill="#f2fbf5"/>
  </g>
  <text x="646" y="338" font-size="11.5" fill="#57606a">chief + workers</text>
  <text x="968" y="338" font-size="11.5" fill="#57606a">chief + workers</text>

  <text x="801" y="410" text-anchor="middle" font-size="12.5" fill="#57606a">isolated by construction — one tribe cannot see another's bus, storage, or secrets</text>

  <!-- substrate -->
  <rect x="462" y="464" width="678" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="801" y="486" text-anchor="middle" font-size="12" fill="#57606a">NATS + JetStream (bus · durable state) · Wasmtime component sandbox · FS-canonical profile under the profile root</text>
</svg>
